---
layout: default
---

<main id="main-content" class="page-shell">
  <div class="shell">
    <header class="page-hero">
      <p class="eyebrow">{{ page.section | default: "Section" }}</p>
      <h1>{{ page.title }}</h1>
      {% if page.standfirst %}<p>{{ page.standfirst }}</p>{% endif %}
    </header>

    <div class="page-body prose">
      {{ content }}
    </div>
  </div>
</main>
