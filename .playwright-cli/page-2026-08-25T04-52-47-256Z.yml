        - generic [ref=f5e86]:
          - paragraph [ref=f5e87]: Nothing about the air in Example District A announces itself. There is no smell on most days, no visible plume, no siren. The annual mean concentration of fine particulate matter is 55 µg/m³, and that number is the whole story.
          - paragraph [ref=f5e88]:
            - text: The arithmetic is short. The WHO annual guideline is 5 µg/m³. This district sits 50 µg/m³ above it. The AQLI coefficient of 0.098 years per µg/m³ turns that gap into
            - strong [ref=f5e89]: 4.9 years
            - text: of life expectancy, held by the difference between the air people here breathe and the air the guideline describes.
          - heading "What the number means" [level=2] [ref=f5e90]
          - paragraph [ref=f5e91]: Nearly five years is not a rounding error in a life. It is the difference between meeting a grandchild and not. Set against causes of death that have names, budgets and awareness campaigns, particulate pollution in this district outweighs most of them — and unlike them it has no diagnosis, no clinic, and no moment at which anyone is told they have it.
          - paragraph [ref=f5e92]: "It is also worth being precise about who holds the years. This is not a prediction about any particular resident. It is a statement about a population: if everyone in Example District A breathed air at 5 µg/m³ for the rest of their lives, average life expectancy across that population would be about 4.9 years higher than it is on current air. The years are distributed unevenly, and they are not owed to anyone in particular."
          - heading "What the number is not" [level=2] [ref=f5e93]
          - paragraph [ref=f5e94]: It is not a measurement. It is a translation of a measurement through a coefficient estimated elsewhere, on a different population, under assumptions that this district was never checked against.
          - paragraph [ref=f5e95]: It is not a forecast. It describes a counterfactual — sustained exposure at the guideline, starting now — that no policy currently on the table would deliver on that timetable. A district that halves its concentration over fifteen years does not collect 4.9 years, or half of them, on any schedule this figure can tell you.
          - paragraph [ref=f5e96]: And it is not a claim about a cause of death. Nobody dies of 55 µg/m³. They die of the cardiovascular and respiratory conditions that sustained exposure makes more likely and more severe, which is a different sentence with different evidence behind it.
          - heading "Where to be sceptical" [level=2] [ref=f5e97]
          - paragraph [ref=f5e98]:
            - strong [ref=f5e99]: The baseline is a single year.
            - text: One annual mean is a thin baseline for a figure expressed in decades. A year with unusual meteorology — a long inversion, an early monsoon — moves the mean by several µg/m³ without anything changing about what is emitted. A three-year rolling mean would be the honest input, and this post does not use one.
          - paragraph [ref=f5e100]:
            - strong [ref=f5e101]: The linearity is doing heavy lifting.
            - text: A constant β means the first microgram removed and the fiftieth are worth the same. At 55 µg/m³ the district sits well above the range where that assumption is most comfortable, and the true relationship may flatten at high concentrations. If it does, this figure is too high.
          - paragraph [ref=f5e102]:
            - strong [ref=f5e103]: The district mean hides the exposure that matters.
            - text: Population-weighting corrects for where people live, not for how they live. A roadside household and a household two kilometres upwind receive the same number here, and their actual exposures may differ by more than the gap this whole post is about.
          - heading "The lever" [level=2] [ref=f5e104]
          - paragraph [ref=f5e105]: "Concentration is not weather. Roughly speaking, this district’s 55 µg/m³ is the sum of decisions made somewhere: what the power fleet burns, whether the brick kilns are converted, whether crop residue has an economic alternative to burning, how freight moves through the district and on what fuel."
          - paragraph [ref=f5e106]: Each of those has a number attached, and the numbers add up to this one. The years are the price; the decisions are the invoice. Whether the district pays it is not a question about air.
