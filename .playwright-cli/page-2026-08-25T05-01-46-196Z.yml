        - listitem [ref=f3e254]: Pollution target used (guideline, national standard, or policy commitment)
        - listitem [ref=f3e255]: Geographic unit
        - listitem [ref=f3e256]: Population-weighting method
        - listitem [ref=f3e257]: PM₂.₅ data source
        - listitem [ref=f3e258]: Life-expectancy coefficient
        - listitem [ref=f3e259]: Uncertainty and caveats
      - paragraph [ref=f3e260]: A post that cannot fill all seven is not finished. It is a draft with a headline.
