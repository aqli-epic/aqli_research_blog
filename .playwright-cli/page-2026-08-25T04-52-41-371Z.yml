          - listitem [ref=f4e255]: Geographic unit
          - listitem [ref=f4e256]: Population-weighting method
          - listitem [ref=f4e257]: PM₂.₅ data source
          - listitem [ref=f4e258]: Life-expectancy coefficient
          - listitem [ref=f4e259]: Uncertainty and caveats
        - paragraph [ref=f4e260]: A post that cannot fill all seven is not finished. It is a draft with a headline.
