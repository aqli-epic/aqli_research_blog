        - generic [ref=f4e246]:
          - paragraph [ref=f4e247]:
            - strong [ref=f4e248]: What the equation does not do
          - paragraph [ref=f4e249]: It is linear. It assumes the relationship holds across the full range of concentrations, that exposure is sustained, and that the population is comparable to the one the coefficient was estimated on. Where a story leans on any of those assumptions harder than usual, the story has to say so.
        - heading "Minimum reporting checklist" [level=2] [ref=f4e250]
