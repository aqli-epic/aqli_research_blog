        - generic [ref=f5e246]:
          - paragraph [ref=f5e247]:
            - strong [ref=f5e248]: What the equation does not do
          - paragraph [ref=f5e249]: It is linear. It assumes the relationship holds across the full range of concentrations, that exposure is sustained, and that the population is comparable to the one the coefficient was estimated on. Where a story leans on any of those assumptions harder than usual, the story has to say so.
        - heading "Minimum reporting checklist" [level=2] [ref=f5e250]
        - paragraph [ref=f5e251]: "Every post declares, in order:"
