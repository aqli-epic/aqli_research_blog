          - listitem [ref=f5e255]: Geographic unit
          - listitem [ref=f5e256]: Population-weighting method
          - listitem [ref=f5e257]: PM₂.₅ data source
          - listitem [ref=f5e258]: Life-expectancy coefficient
          - listitem [ref=f5e259]: Uncertainty and caveats
        - paragraph [ref=f5e260]: A post that cannot fill all seven is not finished. It is a draft with a headline.
